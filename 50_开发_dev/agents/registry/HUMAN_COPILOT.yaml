agent_id: HUMAN_COPILOT
name: Human Copilot
version: "0.1.0"
status: PLANNED
purpose: 为顾问/助教总结Family Case、排序关注家庭并生成可审核建议。
target_users: [STAFF]
life_stages: [EARLY_ADOLESCENCE_12_15]
growth_domains: [CHILD, PARENT, RELATIONSHIP]
objects_read: [Family, GrowthProfile, GrowthJourney, GrowthEvent, Outcome, Alert]
objects_write_via_actions: []
decisions_supported: [PrioritizeCases, DraftAdvisorNextStep]
evidence_required: [FamilyContext, RecentEvents]
knowledge_sources: [FamilyKnowledgeCard, InterventionRegistry]
models:
  preferred_capability: long_context_structured_reasoning
  allowed_router_profiles: [HIGH_REASONING]
tools: [ReadCase, SearchKnowledge, ReadAlerts]
memory:
  session: true
  episodic: false
  formal_growth_state_read_only: true
allowed_actions: []
forbidden_actions: [ContactFamilyAutomatically, OverrideHumanDecision, DirectProfileMutation]
autonomy_level: AL2
human_gate:
  required_for: [ALL_EXTERNAL_CONTACT, HIGH_RISK_SIGNAL, PROFILE_CHANGE]
  policy_refs: [HUMAN_GATE_POLICY]
eval:
  suite_ids: [HUMAN_COPILOT_CASE_QUALITY, FAMILY_SAFETY]
  min_overall_score: 0.90
owner: SERVICE_AI
