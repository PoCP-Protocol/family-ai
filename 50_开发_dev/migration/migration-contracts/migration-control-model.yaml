version: 1.0
status: PROPOSED_CANONICAL_CONTRACT
lm0_scope: design_only
contracts:
  MigrationBatch:
    fields:
      migration_batch_id: string
      source_system: string
      source_snapshot: string
      mapping_version: string
      ontology_version: string
      status: enum
      started_at: datetime
      finished_at: datetime nullable
      source_count: integer
      mapped_count: integer
      quarantine_count: integer
      imported_count: integer
      failed_count: integer
      initiated_by: string
  MigrationRecord:
    fields:
      migration_record_id: string
      migration_batch_id: string
      source_system: string
      source_entity_type: string
      source_entity_id: string
      target_entity_type: string nullable
      target_entity_id: string nullable
      mapping_rule: string
      mapping_version: string
      source_checksum: string
      target_checksum: string nullable
      status: enum
      created_at: datetime
  MigrationIssue:
    fields:
      issue_id: string
      migration_batch_id: string
      source_system: string
      source_entity_type: string
      source_entity_id: string
      issue_type: enum
      severity: enum
      description: string
      status: enum
      resolved_by: string nullable
      resolved_at: datetime nullable
  MigrationQuarantineItem:
    fields:
      quarantine_id: string
      migration_batch_id: string
      source_system: string
      source_entity_type: string
      source_entity_id: string
      reason_code: enum
      raw_payload_reference: string
      review_status: enum
      reviewed_by: string nullable
      reviewed_at: datetime nullable
safety:
  - Do not put full sensitive raw payload directly into audit tables.
  - Do not create production schema during LM0.
  - Do not perform production Family writes during LM0.