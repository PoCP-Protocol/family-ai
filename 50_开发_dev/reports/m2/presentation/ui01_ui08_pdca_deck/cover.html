<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box} html,body{height:100%;margin:0} .slide-container{width:1280px;min-height:720px;background:#E0F2E9;color:#0B4619;font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column} .main{min-height:620px;display:grid;grid-template-columns:1.18fr .82fr;gap:28px;padding:74px 60px 0}.eyebrow{font-size:17px;letter-spacing:2px;font-weight:700;color:#F56476;margin-bottom:20px}.title{font-size:58px;line-height:1.12;letter-spacing:-2px;font-weight:900;max-width:680px}.subtitle{font-size:25px;line-height:1.5;color:#1A202C;margin-top:22px;max-width:570px}.meta{font-size:15px;letter-spacing:.8px;color:#3D5A48;margin-top:36px}.network{min-height:430px;display:flex;align-items:center;justify-content:center;position:relative}.line{position:absolute;width:300px;border-top:2px dashed #78A98A;transform:rotate(-15deg)}.line.two{transform:rotate(35deg);width:240px}.node{width:110px;height:110px;border:2px solid #0B4619;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#EAF8F0;font-size:18px;font-weight:800;position:absolute}.n1{top:72px;left:58px}.n2{top:188px;right:40px;border-color:#F56476;color:#B63343}.n3{bottom:72px;left:126px;width:144px;height:144px;background:#0B4619;color:#E0F2E9}.stamp{font-size:13px;letter-spacing:1.8px;color:#0B4619;border-top:1px solid #78A98A;margin:0 60px;padding-top:14px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="slide-container">
  <div class="main">
    <section>
      <div class="eyebrow">FAMILY GROWTH AI PLATFORM</div>
      <h1 class="title">UI-01 至 UI-08<br>闭环成果与 PDCA 测试总结</h1>
      <p class="subtitle">从今日行动、成长解释与方案预览，延展到家庭私有陪跑、成长档案与过程回顾。</p>
      <p class="meta">开发环境阶段性成果 · 2026-08-19</p>
    </section>
    <section class="network" aria-label="成长闭环抽象图">
      <div class="line"></div><div class="line two"></div>
      <div class="node n1">行动</div><div class="node n2">回顾</div><div class="node n3">家庭<br>成长闭环</div>
    </section>
  </div>
  <div class="stamp"><span>内部开发成果复盘</span><span>TESTED · TRACEABLE · FAMILY-PRIVATE</span></div>
</div>
</body>
</html>
