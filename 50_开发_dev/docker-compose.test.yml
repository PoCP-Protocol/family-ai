services:
  postgres-test:
    image: postgres:15
    environment:
      POSTGRES_USER: family
      POSTGRES_PASSWORD: family
      POSTGRES_DB: family_test
    ports:
      - "127.0.0.1::5432"
    volumes:
      - family_pg_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family -d family_test"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  family_pg_test_data: