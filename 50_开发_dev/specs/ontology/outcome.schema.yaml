$schema: https://json-schema.org/draft/2020-12/schema
$id: outcome.schema.yaml
title: Outcome
type: object
additionalProperties: false
required:
  - outcome_id
  - family_id
  - dimension_id
  - measurement_window
  - source
  - confidence
properties:
  outcome_id: {type: string, format: uuid}
  family_id: {type: string, format: uuid}
  dimension_id: {type: string}
  baseline: {}
  current: {}
  measurement_window:
    type: object
    required: [start, end]
    properties:
      start: {type: string, format: date-time}
      end: {type: string, format: date-time}
  source: {type: string}
  evidence_ids:
    type: array
    items: {type: string}
  confidence:
    type: number
    minimum: 0
    maximum: 1
  context:
    type: object
  possible_confounders:
    type: array
    items: {type: string}
