$schema: https://json-schema.org/draft/2020-12/schema
$id: family.schema.yaml
title: Family
type: object
additionalProperties: false
required:
  - family_id
  - status
  - created_at
  - version
properties:
  family_id:
    type: string
    format: uuid
    description: Family platform canonical identifier. Never supplied by client on creation.
  display_name:
    type: string
    minLength: 1
    maxLength: 100
  status:
    enum: [ACTIVE, INACTIVE, ARCHIVED]
  primary_contact_person_id:
    type: [string, "null"]
    format: uuid
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  version:
    type: integer
    minimum: 1
