$schema: https://json-schema.org/draft/2020-12/schema
$id: growth_profile.schema.yaml
title: GrowthProfile
type: object
additionalProperties: false
required:
  - profile_id
  - family_id
  - subject_type
  - subject_id
  - life_stage_code
  - dimension_states
  - confidence
  - version
  - effective_from
properties:
  profile_id: {type: string, format: uuid}
  family_id: {type: string, format: uuid}
  subject_type:
    enum: [CHILD, PARENT, RELATIONSHIP]
  subject_id: {type: string}
  life_stage_code:
    enum: [EARLY_ADOLESCENCE_12_15]
  dimension_states:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [dimension_id, state, evidence_ids, confidence]
      properties:
        dimension_id: {type: string}
        state:
          enum: [EMERGING, DEVELOPING, PRACTICING, STABILIZING]
        observable_signals:
          type: array
          items: {type: string}
        evidence_ids:
          type: array
          items: {type: string}
        confidence:
          type: number
          minimum: 0
          maximum: 1
  strengths:
    type: array
    items: {type: string}
  growth_opportunities:
    type: array
    items: {type: string}
  confidence:
    type: number
    minimum: 0
    maximum: 1
  version:
    type: integer
    minimum: 1
  effective_from: {type: string, format: date-time}
  effective_to: {type: [string, "null"], format: date-time}
