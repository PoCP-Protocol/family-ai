version: 0.1
action: RecordOutcomeObservation
purpose: Record an explicitly sourced outcome observation after an intervention/action period without converting it into fact, diagnosis, GrowthProfile state, score, ranking, or causal effect.
wave: M2_WAVE3
scenario: PARENT_CHILD_COMMUNICATION_CONFLICT_12_15
input:
  required:
    - family_id
    - subject_person_id
    - observer_person_id
    - observer_role
    - perspective
    - intervention_episode_id
    - observation_text
    - observed_at
    - boundary
    - idempotency_key
  optional:
    - action_refs
    - reflection_refs
    - evidence_refs
    - limitations
  boundary_values:
    - OBSERVATION_IS_NOT_CAUSAL_EFFECT
preconditions:
  - family_exists
  - subject_belongs_to_family
  - observer_belongs_to_family_or_authorized_role
  - intervention_episode_exists
  - required_growth_consents_active
  - safety_route_is_NORMAL
effects:
  - create_outcome_observation
  - append_audit_record
  - emit_OutcomeObservationRecorded
boundaries:
  - perspective_is_not_fact
  - observation_is_not_fact
  - outcome_observation_is_not_causal_effect
  - parent_observation_is_not_child_observation
  - no_profile_write
  - no_priority_write
  - no_next_intervention_start
  - no_score_write
  - no_ranking_write
  - no_ai_runtime_call
idempotency: required
audit: required
outbox: required
policy_version: M2_WAVE3_DETERMINISTIC_V1