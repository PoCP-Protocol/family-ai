version: 0.1.0
asset_ref: FAMILY_ASSESSMENT_ITEM_BANK_REGISTRY
status: draft
owner: Family Assessment Skill
purpose: >
  Defines the first model-backed assessment item bank for Family Education Large
  Model. Items collect parent perspective, observable context, and support needs.
  Items do not produce diagnosis, ranking, family total score, or canonical child facts.

item_bank_rules:
  - item_ref must be stable and uppercase snake case.
  - every item must link to construct_refs and need_refs.
  - every item must declare respondent_role and answer_mode.
  - answer options capture perspective and context, not truth by themselves.
  - high-risk signals require Human Gate or conservative clarification.

answer_scales:
  - scale_ref: FIVE_POINT_FREQUENCY
    labels: [rarely, sometimes, often, very_often, not_sure]
    interpretation_boundary: perspective

  - scale_ref: FIVE_POINT_AGREEMENT
    labels: [strongly_disagree, disagree, mixed, agree, strongly_agree]
    interpretation_boundary: perspective

  - scale_ref: CONTEXT_MULTI_SELECT
    labels: [school, home, peers, digital_device, sleep_health, parent_stress, not_sure]
    interpretation_boundary: context_signal

  - scale_ref: UI02_FOUR_POINT_FAMILY_FREQUENCY
    labels: [often, sometimes, rarely, not_sure]
    interpretation_boundary: parent_perspective

items:
  - item_ref: LEARNING_HABITS_Q01
    prompt: 过去两周，孩子开始写作业前常需要反复提醒。
    respondent_role: parent
    answer_mode: UI02_FOUR_POINT_FAMILY_FREQUENCY
    domain_refs: [ACADEMIC_K12]
    need_refs: [CHILD_LEARNING_SUPPORT_NEED, FAMILY_LEARNING_ENVIRONMENT_NEED]
    construct_refs: [HOMEWORK_PROCESS, FAMILY_ROUTINE]
    observable_signal_refs: [start_delay, repeated_prompting]
    followup_when: often
    safety_boundary: normal_learning_support

  - item_ref: LEARNING_HABITS_Q02
    prompt: 孩子遇到稍难的题目时，容易拖延、分心或直接放弃。
    respondent_role: parent
    answer_mode: UI02_FOUR_POINT_FAMILY_FREQUENCY
    domain_refs: [ACADEMIC_K12, DEVELOPMENTAL_FOUNDATIONS]
    need_refs: [CHILD_LEARNING_SUPPORT_NEED]
    construct_refs: [LEARNING_STRATEGY_METACOGNITION, SELF_REGULATION_SUPPORT]
    observable_signal_refs: [difficulty_persistence_gap, distraction, avoidance]
    followup_when: often
    safety_boundary: normal_learning_support

  - item_ref: LEARNING_HABITS_Q03
    prompt: 家里目前缺少稳定的学习开始、休息和收尾节奏。
    respondent_role: parent
    answer_mode: UI02_FOUR_POINT_FAMILY_FREQUENCY
    domain_refs: [ACADEMIC_K12, FAMILY_SYSTEM]
    need_refs: [FAMILY_LEARNING_ENVIRONMENT_NEED, FAMILY_RHYTHM_NEED]
    construct_refs: [FAMILY_ROUTINE, HOMEWORK_PROCESS]
    observable_signal_refs: [routine_instability, missing_review]
    followup_when: often
    safety_boundary: normal_learning_support

  - item_ref: EMOTION_REGULATION_Q01
    prompt: 过去两周，孩子情绪上来后需要较长时间才能恢复。
    respondent_role: parent
    answer_mode: UI02_FOUR_POINT_FAMILY_FREQUENCY
    domain_refs: [PSYCHOSOMATIC_WELLBEING, RELATIONSHIP]
    need_refs: [CHILD_EMOTIONAL_SUPPORT_NEED, PARENT_METHOD_NEED]
