version: 0.1.0
asset_ref: FAMILY_EDUCATION_MODEL_FOUNDATION_MANIFEST
status: draft
owner: Family Education Industry Model
purpose: >
  Defines the first buildable foundation of the Family Education Large Model.
  The foundation is an asset system, not a single prompt or chatbot. It is made
  of versioned registries, schemas, component contracts, evaluation gates, and
  product-surface bindings that support the Family Growth Platform.

model_position:
  public_name_zh: 法咪莉校长
  public_name_usage: external-facing name for the Family Education Large Model
  foundation_for: Family Growth Platform
  first_ui_baseline: UI-01..UI-35
  first_runtime_rule: product surfaces compose model components; product surfaces do not own domain logic
  current_authorization_boundary:
    business_runtime: AUTHORIZED
    database_schema_change: NOT_AUTHORIZED
    live_external_ai: AUTHORIZED
    ui_visual_change: NOT_AUTHORIZED
    authorization_ref: governance/AUTHORIZATION_REGISTRY.yaml#G1A_FAMILY_EDUCATION_ASSESSMENT_MODEL_INTERNAL
    scope: UI-02/UI-03 Family Education Assessment Model internal/local only;pilot and production remain unauthorized.

architecture_principle:
  statement: Stand on the shoulders of giants, but keep the Family domain intelligence first-party.
  meaning: >
    Mature open-source harnesses, schema tools, evaluation methods, retrieval stacks,
    labeling workflows, and small-model tooling should accelerate the model factory.
    They must not replace Family-owned domain registries, need taxonomies, action
    catalogs, safety boundaries, expert labels, and outcome definitions.

foundation_principles:
  - Family Education Large Model is a componentized industry model, not only a generative LLM.
  - It must answer child needs, parent needs, family needs, and next support candidates.
  - It must support memory, realtime dialogue, multimodal artifacts, actions, outcomes, and human service.
  - It must preserve Perspective != Fact and Hypothesis != Fact.
  - It must preserve Recommendation != Decision != Action.
  - It must not create family total scores or family rankings.
  - It must route model behavior through Model Gateway once runtime is authorized.
  - It must keep high-risk and professional scenarios behind Human Gate.

