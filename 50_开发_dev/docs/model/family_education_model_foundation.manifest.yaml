validated_model_abilities:
  - ask assessment questions through item refs
  - map answers to need refs and construct refs
  - produce structured interpretations without diagnosis or ranking
  - match action candidates to constructs and review windows
  - evaluate outputs against safety and scenario expectations
  - generate consent-aware memory update candidates without writing core state
  - distill memory and conversation schemas into structured training records

first_build_sequence:
  - V4.2-001_MODEL_ASSET_VALIDATION
  - V4.2-002_COMPONENT_REGISTRY_FREEZE
  - V4.2-003_ITEM_BANK_AND_INTERPRETATION_SCHEMA
  - V4.2-004_SCENARIO_EVAL_SEED
  - V4.2-005_UI01_UI35_MODEL_BINDING_BASELINE
  - V4.2-006_UI02_UI03_CONTRACT_COMPOSITION
  - V4.2-007_MEMORY_DIALOGUE_MULTIMODAL_MOCK
  - V4.2-008_ACTION_OUTCOME_LOOP

acceptance:
  - all listed P0 assets parse as YAML
  - each listed P0 asset exists in docs/model
  - component registry declares required fields and registered components
  - every registered component contains the required component contract fields
  - every component dependency points to a registered component or an approved external boundary
  - UI model binding registry covers exactly UI-01..UI-35 once
  - every UI model binding points to registered model components
  - model work remains inside current gate until runtime authorization changes