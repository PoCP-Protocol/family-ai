version: 0.1.0
asset_ref: FAMILY_UI_MODEL_BINDING_REGISTRY
status: draft
owner: Family Education Industry Model
purpose: >
  Binds UI-01..UI-34 product display baseline to Family Education Large Model
  components. This registry does not authorize UI visual change, runtime expansion,
  database schema change, or live external AI. It defines the first model support
  baseline behind the existing UI surfaces.

source_of_truth:
  ui_baseline: ../governance/FAMILY_CONSUMER_UI_BASELINE_V1.json
  surface_contract: ../packages/contracts/src/family-growth-os.ts
  model_component_registry: family_model_component.registry.yaml

binding_rules:
  - UI remains product display and projection composition.
  - UI must not own canonical family truth or domain logic.
  - All writes remain Named Actions owned by domains.
  - Model outputs are hypotheses, recommendations, action candidates, or projections until confirmed through authorized flows.
  - No Family Total Score, family ranking, medical diagnosis, or psychiatric diagnosis is introduced.
  - Existing consumer UI visual baseline remains unchanged during G1-A.

registered_ui_bindings:
  - ui_id: UI-01
    product_surface: 家庭成长首页
    primary_model_components: [FAMILY_DOMAIN_KERNEL, FAMILY_MEMORY_DIALOGUE_COMPONENT, FAMILY_ASSESSMENT_V0_COMPONENT]
    support_mode: home_summary_and_next_help_candidate
    model_output_boundary: projection_or_recommendation_candidate
    authorization_boundary: READ_ONLY_PROJECTION

  - ui_id: UI-02
    product_surface: 家庭测评
    primary_model_components: [FAMILY_ASSESSMENT_V0_COMPONENT, FAMILY_DOMAIN_KERNEL]
    support_mode: assessment_interview_and_need_signal_capture
    model_output_boundary: perspective_and_assessment_response
    authorization_boundary: GATE_BOUNDARY

  - ui_id: UI-03
    product_surface: 家庭成长解读 / AI诊断
    primary_model_components: [FAMILY_ASSESSMENT_V0_COMPONENT, FAMILY_REALTIME_DIALOGUE_COMPONENT, FAMILY_DOMAIN_KERNEL]
    support_mode: growth_diagnostic_hypothesis_and_explanation
    model_output_boundary: hypothesis_not_fact
    authorization_boundary: GATE_BOUNDARY

  - ui_id: UI-04
    product_surface: 90 天成长方案
    primary_model_components: [FAMILY_ACTION_OUTCOME_COMPONENT, FAMILY_ASSESSMENT_V0_COMPONENT]
    support_mode: growth_plan_candidate
