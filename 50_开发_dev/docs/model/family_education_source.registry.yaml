version: 0.1.0
asset_ref: FAMILY_EDUCATION_SOURCE_REGISTRY
status: draft
owner: Family Education Industry Model
source_doc: ../FAMILY_ASSESSMENT_AI_SKILL_RESEARCH.md
purpose: >
  Tracks external research, public guidance, mature practice patterns, and internal
  practice sources that can inform Family's constructs, item banks, actions,
  evaluation labels, and small-model datasets.

registry_rules:
  - source_ref must be stable and uppercase snake case.
  - source_type must be research, public_guidance, instrument_pattern, practice_signal, tool_pattern, or internal_artifact.
  - external sources are method inputs, not automatic product claims.
  - protected wording, proprietary scoring, and unsupported diagnostic claims must not be copied.
  - every source should declare extraction_status before product use.

sources:
  - source_ref: SDQ_PATTERN
    name: Strengths and Difficulties Questionnaire pattern
    source_type: instrument_pattern
    domain_refs: [DEVELOPMENTAL_FOUNDATIONS, PSYCHOSOMATIC_WELLBEING]
    contributes: [brief_multi_scale_structure, impact_supplement, respondent_versions, follow_up_design]
    family_use: Learn short-screening architecture and impact follow-up pattern.
    extraction_status: pending_deep_review

  - source_ref: FAMILY_CHECKUP_PATTERN
    name: Family Check-Up pattern
    source_type: practice_signal
    domain_refs: [PARENTING, FAMILY_SYSTEM, HUMAN_SERVICE]
    contributes: [assessment_feedback_intervention_loop, tailored_parenting_support, motivational_feedback]
    family_use: Model assess -> feedback -> choose small action -> review outcome.
    extraction_status: pending_deep_review

  - source_ref: TRIPLE_P_STEPPED_CARE_PATTERN
    name: Triple P stepped-care pattern
    source_type: practice_signal
    domain_refs: [PARENTING, HUMAN_SERVICE]
    contributes: [support_intensity_levels, parenting_skills, self_regulation_orientation]
    family_use: Inform stepped support menu and human-service routing.
    extraction_status: pending_deep_review

  - source_ref: HARVARD_SERVE_RETURN_PATTERN
    name: Harvard Serve and Return pattern
    source_type: public_guidance
    domain_refs: [RELATIONSHIP, DEVELOPMENTAL_FOUNDATIONS]
