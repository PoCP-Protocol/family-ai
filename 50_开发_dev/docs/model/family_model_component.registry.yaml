version: 0.1.0
asset_ref: FAMILY_MODEL_COMPONENT_REGISTRY
status: draft
owner: Family Education Industry Model
source_docs:
  - ../FAMILY_EDUCATION_INTELLIGENCE_MODEL_V0_1.md
  - ../FAMILY_EDUCATION_AI_ERA_MODEL_GAP_ANALYSIS.md
purpose: >
  Defines the component model for Family Education Intelligence. Every domain,
  capability, product surface, evaluation suite, and service integration should be
  registered as a versioned component with stable interfaces, dependencies, ownership,
  and validation rules.

component_principles:
  - The model must be componentized by default, not after the system grows large.
  - A component can be added, upgraded, disabled, or replaced without rewriting the domain kernel.
  - Components depend on stable refs: need_ref, construct_ref, source_ref, action_ref, outcome_ref, memory_ref, artifact_ref, and policy_ref.
  - Components cannot directly mutate core ontology or core family state.
  - Components that produce recommendations must output structured candidates, not final decisions.
  - Components must declare evaluation gates before production use.
  - Components must declare consent, evidence, safety, and human-review boundaries.

component_contract:
  required_fields:
    - component_ref
    - component_kind
    - version
    - owner
    - lifecycle_status
    - input_contract_refs
    - output_contract_refs
    - dependency_refs
    - evaluation_refs
    - policy_refs
  optional_fields:
    - domain_refs
    - need_refs
    - construct_refs
    - source_refs
    - action_refs
    - outcome_refs
    - memory_refs
    - artifact_refs
    - model_gateway_profile
    - localization_profile_refs
    - human_service_role_refs
    - rollback_strategy

component_kinds:
  - kind_ref: DOMAIN_COMPONENT
    description: Adds a family education domain such as Academic K12, Physical Health, AI Literacy, or Human Service.
    required_interfaces:
      - domain.registry
      - need.registry
      - construct.registry
      - source.registry
      - evaluation.schema

  - kind_ref: ASSESSMENT_COMPONENT
    description: Adds a versioned assessment tool, question bank, branching rule set, or interpretation schema.
    required_interfaces:
      - item_bank.registry
      - response.schema
      - interpretation.schema
      - safety_gate.policy
      - outcome_signal.schema

  - kind_ref: ACTION_COMPONENT
    description: Adds support actions, parent learning plans, child practice paths, or family routines.
    required_interfaces:
      - action.catalog
      - action_precondition.schema
      - action_review.schema
      - outcome_signal.schema

  - kind_ref: MEMORY_COMPONENT
    description: Adds memory scopes, retention rules, recall rules, and memory update candidate schemas.
    required_interfaces:
      - memory.schema
      - retention.policy
      - consent.policy
      - event.schema

  - kind_ref: DIALOGUE_COMPONENT
    description: Adds realtime parent, child, teacher, or service conversations with role-aware extraction and clarification.
    required_interfaces:
      - conversation.schema
      - intent.registry
      - structured_response.schema
      - memory_update.schema
      - safety_gate.policy

  - kind_ref: MULTIMODAL_COMPONENT
    description: Adds understanding of photo, image, audio, video, document, chart, code, or mixed artifacts.
    required_interfaces:
      - artifact.schema
      - artifact_provenance.schema
      - artifact_observation.schema
      - consent.policy
      - human_review.policy

  - kind_ref: SMALL_MODEL_COMPONENT
    description: Adds classifiers, routers, rerankers, action matchers, or evaluators trained on approved Family datasets.
    required_interfaces:
      - training_dataset.manifest
      - model_card
      - eval_report
      - inference_contract
      - rollback_strategy

  - kind_ref: KNOWLEDGE_COMPONENT
    description: Adds approved source collections, retrieval indexes, citation templates, and evidence extraction flows.
    required_interfaces:
      - source.registry
      - evidence.schema
      - retrieval_contract
      - citation_policy

  - kind_ref: HUMAN_SERVICE_COMPONENT
    description: Adds educator, counselor, teacher, health, social support, or community service handoff capability.
    required_interfaces:
      - service_role.registry
      - handoff_context.schema
      - review_label.schema
      - service_outcome.schema

  - kind_ref: LOCALIZATION_COMPONENT
    description: Adds region, curriculum, language, culture, school-system, or service-resource context.
    required_interfaces:
      - localization_profile.schema
      - curriculum_context.schema
      - source.registry
      - evaluation_slice

