extension_lifecycle:
  - stage: proposed
    requirement: Component has a clear purpose and owner.
  - stage: drafted
    requirement: Component has input/output contracts and declared dependencies.
  - stage: reviewed
    requirement: Domain, safety, evidence, and engineering review are complete.
  - stage: pilot
    requirement: Component is enabled for limited families or internal test cohorts.
  - stage: production
    requirement: Evaluation gates, observability, rollback, and support procedures are active.
  - stage: deprecated
    requirement: Replacement path and data migration policy are documented.

compatibility_rules:
  - Breaking changes require a new major component version.
  - New optional fields require schema defaults or backward-compatible readers.
  - Components may depend on stable kernel refs but should not depend on product UI route names.
  - Product surfaces should compose components through contracts, not copy internal model logic.
  - Evaluation suites must run per component and across component combinations.
