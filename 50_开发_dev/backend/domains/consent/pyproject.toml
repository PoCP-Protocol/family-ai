[project]
name = "family-consent-domain"
version = "0.1.0"
description = "Consent domain -- ported from apps/api/src/modules/family/consent-guard.ts (assertRequiredGrowthConsents) and the consents-table half of family.service.ts (grantConsent)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "sqlalchemy>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
