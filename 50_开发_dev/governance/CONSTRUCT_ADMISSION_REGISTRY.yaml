# Construct Admission Registry — 家庭测评/AI解读construct_ref白名单的唯一审核留痕
#
# 背景：2026-08-26曾发生模型编造construct_ref的真实事故(PARENT_CHILD_COMMUNICATION_QUALITY /
# COMMUNICATION_RESPECT_TURN_TAKING，两个都没走过人工审核就出现在AI输出里)。此后
# backend/domains/assessment/infrastructure/claude_interpretation.py 的
# _LEGAL_CONSTRUCT_REFS 就是防这类事故的白名单——本文件是这个白名单每次扩容的
# 唯一可追溯审核记录，仿照 governance/AUTHORIZATION_REGISTRY.yaml 的留痕原则：
# 「AI Agent 不得自增授权」，扩大这个白名单必须有人工确认落记，不能因为某个construct
# 已经"写在文档里"(如 docs/model/family_education_construct.registry.yaml，该文档
# 整体status仍为draft)就自动视为审核通过。
#
# 每条记录字段：
#   construct_ref        与 docs/model/family_education_construct.registry.yaml 的
#                         construct_ref 完全一致
#   status                ADMITTED / HOLD / REJECTED
#   knowledge_backing     该construct在 20_知识_knowledge 证据库里有没有对应理论卡支撑
#                         (none / weak / strong，供后续复审参考，不是审核唯一依据)
#   risk_note             审核时识别的具体风险点(如贴近医疗判断边界、贴近能力画像、
#                         学理本身存在争议等)
#   admitted_by           人工确认者
#   admission_ref         审核依据——如实记录实际发生的确认过程，不拨高过程的正式性
#   admitted_at           日期
#   legal_construct_refs_updated  该次admission是否已经把construct_ref写进了
#                         claude_interpretation.py的_LEGAL_CONSTRUCT_REFS(true/false)——
#                         记录本身与代码落地是两件事，本字段用于核对两者是否同步。

