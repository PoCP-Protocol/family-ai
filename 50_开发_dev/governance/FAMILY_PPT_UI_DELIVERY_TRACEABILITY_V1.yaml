    blocked: []
  - slice: VS-01
    baseline_objectives: [BL-02, BL-03, BL-08, BL-10]
    status: IMPLEMENTED_TESTED_DEV
    completed_capabilities:
      - UI-01统一商业首页投影与App/Web同源读取
      - 明确孩子选择、年龄范围与SERVICE同意状态，不使用首孩子捷径
      - RequestGrowthHelp到ConfirmGrowthIntent到ResourceRecommendation到FamilyServiceDecision真实闭环
      - NORMAL、REVIEW与HIGH_RISK安全分流，高风险禁止进入普通Intent链路
      - 各Named Action幂等，RequestGrowthHelp具备Audit与Outbox事件
      - UI-02使用已准入版本化Tool、显式孩子与ASSESSMENT同意启动可恢复会话
      - UI-02回答采用追加式修订，提交生成E1家庭视角Evidence且提交后不可修改
      - UI-02 App/Web共用START_ASSESSMENT、SAVE_ASSESSMENT_RESPONSE与SUBMIT_ASSESSMENT
      - UI-03从已提交Assessment/Evidence与版本化NeedType目录生成Hypothesis，AI保持NOT_INVOKED
      - UI-03展示来源、三项局限与非事实非诊断边界，家庭CONFIRM后才创建GrowthIntent
      - UI-03支持DISMISS为NO_ACTION，App/Web决定幂等并具备Audit与Outbox
      - UI-09以GrowthAction为唯一任务事实，App/Web共用FamilyTodayProjection与受控任务动作
      - UI-09开始、暂停、继续、取消、完成与部分/未完成终态均由数据库持久化并带row_version
      - UI-09状态动作具备family scope、consent/safety复验、幂等、Audit与Outbox
      - UI-09完成、暂停和取消状态支持客户端与API服务重启后的PostgreSQL回读
