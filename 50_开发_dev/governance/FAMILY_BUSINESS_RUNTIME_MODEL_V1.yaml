runtime_slices:
  - id: VS-00
    name: 身份、租户、家庭与同意可信根
    order: 0
    implementation_status: IMPLEMENTED_TESTED_DEV
    scenarios: [SCN-001]
    runnable_when: 真实PostgreSQL、迁移、认证、Tenant/Family scope、Consent、审计和E2E均通过
  - id: VS-01
    name: 测评到今日行动首闭环
    order: 1
    implementation_status: NEXT_IN_PROGRESS
    scenarios: [SCN-101, SCN-102, SCN-201]
    runnable_when: 一个测试家庭可在App/Web完成测评、确认解读、执行行动并重启回读
  - id: VS-02
    name: 21天计划运行闭环
    order: 2
    implementation_status: PLANNED
    scenarios: [SCN-301]
    runnable_when: 计划可启动、定时、暂停、恢复、复盘和完成，所有状态有Outbox与审计
  - id: VS-03
    name: 服务供给与履约闭环
    order: 3
    implementation_status: PLANNED
    scenarios: [SCN-401, SCN-402]
    runnable_when: 准入供给、时段、人工确认、履约、取消和反馈在测试Adapter下全链可回放
  - id: VS-04
    name: 交易与权益闭环
    order: 4
    implementation_status: PLANNED
    scenarios: [SCN-501, SCN-502]
    runnable_when: sandbox支付、订单、退款、权益激活与核销对账一致
  - id: VS-05
    name: 私有内容到受控发布闭环
    order: 5
    implementation_status: PLANNED
    scenarios: [SCN-601, SCN-602]
    runnable_when: 私有草稿、同意、去标识化、审核、发布和撤回全部可验证

architecture:
  it_flow:
    - Experience: [CMP-APP, CMP-CWEB, CMP-OWEB]
    - Interaction: [CMP-API]
    - DomainTruth: [CMP-DOMAIN]
    - WorkflowEvent: [CMP-WORKFLOW]
    - AIIntelligence: [CMP-AI]
    - DataKnowledge: [CMP-CONTEXT]
    - Integration: [CMP-ADAPTER]
    - Control: [CMP-OBS]
  ai_flow:
    - AuthenticateAndAuthorize
    - CheckConsentPurposeAndDataClass
    - ResolveAiUseCaseAndSkill
    - BuildPermissionedContextSnapshot
    - CallProviderThroughGateway
    - ValidateStructuredOutputAndSafety
    - StoreAiRunAuditAndDerivedArtifact
    - PresentDraftOrHypothesis
    - RequireFamilyOrHumanConfirmation
    - ExecuteNamedActionThroughDomainAPI
  permanent_boundaries:
    - NO_CLIENT_DIRECT_MODEL_CALL
    - NO_AGENT_DIRECT_DATABASE_WRITE
    - NO_SECOND_CANONICAL_DATABASE
    - PERSPECTIVE_NOT_FACT
    - HYPOTHESIS_NOT_FACT
    - SERVICE_COMPLETION_NOT_GROWTH_OUTCOME
    - PLATFORM_MARGIN_RANKING_SIGNAL_ZERO

execution_order:
  - 统一本文件、consumer UI baseline、主数据目录与V4.1术语
  - 先实现VS-00可信根
  - 再实现VS-01真实首闭环
  - 通过真实数据库、API、App/Web、审计和恢复测试后进入VS-02
  - 服务、商业、社区按VS-03到VS-05逐项解冻
  - 每个Slice先TEST/SANDBOX，外部副作用另行Production Gate
