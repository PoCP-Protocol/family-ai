schema_version: FAMILY_BUSINESS_RUNTIME_MODEL_V1
status: EXECUTION_BASELINE_DRAFT
as_of: 2026-08-23
purpose: 将现有3份PPT、consumer UI baseline、六循环、主数据、数据库与V4.1架构收敛为可实施、可校验的业务运行模型

source_authority:
  - id: SRC-ARCH
    path: architecture/FAMILY_AI_PLATFORM_TECH_ARCHITECTURE_V4_1.md
    role: 技术与AI架构边界
  - id: SRC-UI
    path: governance/FAMILY_CONSUMER_UI_BASELINE_V1.json
    role: Consumer UI baseline、循环、领域、动作与运行状态
  - id: SRC-DATA
    path: governance/FAMILY_MASTER_DATA_CATALOG_V2.md
    role: 主数据对象与关系
  - id: SRC-OBJECT
    path: governance/FAMILY_GLOBAL_DATA_OBJECT_EXECUTION_MATRIX_V1.md
    role: 事实、投影、审计与接口对象
  - id: SRC-SCENE
    path: governance/BANGYANG_CONSUMER_UI_SCENARIO_FLOWS_AND_RULES_001.md
    role: 历史场景、异常路径与规则输入
  - id: SRC-PPT
    path: apps/mobile/research/three-ppt-mobile-baseline.md
    role: 产品、服务、商业与视觉叙事，证据等级上限E1
  - id: SRC-PPT-UI-TRACE
    path: governance/FAMILY_PPT_UI_DELIVERY_TRACEABILITY_V1.yaml
    role: 3份PPT目标到 consumer UI baseline、场景、纵切与验收测试的强制追踪基线

canonical_loops:
  - GROWTH
  - PLAN
  - ASSESSMENT
  - SERVICE
  - COMMERCE
  - COMMUNITY

domains:
  - FAMILY_CORE
  - GROWTH_INTELLIGENCE
  - GROWTH_JOURNEY
  - RESOURCE_NETWORK
  - SERVICE_OS
  - COMMERCE_ENTITLEMENT
  - CONTENT_COMMUNITY

actors:
  - id: GUARDIAN
    name: 家长/监护人
    trust: FAMILY_MEMBER
  - id: CHILD
    name: 儿童/青少年家庭成员
    trust: MINOR_RESTRICTED
  - id: ADVISOR
    name: 顾问/班主任
    trust: TENANT_STAFF_SCOPED
  - id: EXPERT
    name: 专家/服务者
    trust: QUALIFIED_PROVIDER_SCOPED
  - id: OPERATOR
    name: 运营人员
    trust: TENANT_STAFF_SCOPED
  - id: REVIEWER
    name: 安全/内容审核人员
    trust: PRIVILEGED_SCOPED
  - id: SYSTEM
    name: 系统工作流
    trust: SERVICE_PRINCIPAL
  - id: AI_RUNTIME
    name: AI运行时
    trust: PROPOSE_ONLY

global_rules:
  - id: BR-001
    name: 范围可信链
    statement: 所有家庭访问必须沿Account到TenantMembership到TenantFamilyBinding到FamilyContext解析，跨范围查询失败关闭
  - id: BR-002
    name: 同意与目的
    statement: 数据读取、AI使用、儿童参与、公开分享与训练同意分别判断，同意可撤回且不得默认扩大
  - id: BR-003
    name: Named Action唯一写入口
    statement: 核心业务状态只能经服务端Named Action写入，客户端、AI与投影不得直写
  - id: BR-004
    name: AI无事实写权
    statement: AI只能生成Draft、Hypothesis、Explanation或Recommendation，确认后才能进入Named Action
  - id: BR-005
    name: 事实边界
    statement: Fact、Perspective、Evidence、Recommendation、Decision、Action与Outcome必须分离存储和展示
  - id: BR-006
    name: 幂等与并发
    statement: 所有事实写入带idempotency_key、correlation_id与row_version，同键异请求拒绝
  - id: BR-007
    name: 事务事件
    statement: 领域写入与OutboxEvent同事务提交，消费者按至少一次投递并保证幂等
  - id: BR-008
    name: 外部副作用隔离
    statement: 支付、通知、预约、公开发布与真人联系只能通过环境感知Adapter并产生Receipt
  - id: BR-009
    name: 未成年人安全
    statement: 儿童输入最小化、可见性受限，高风险内容进入Human Gate，不得形成永久标签或自动诊断
  - id: BR-010
    name: 禁止总分与跨家庭排名
    statement: 不生成Family Total Score、儿童永久分数或跨家庭成长排名
  - id: BR-011
    name: 服务不等于效果
    statement: ServiceCompletion、ActionCompletion与GrowthOutcome相互独立，结果必须有来源、时间与确认边界
  - id: BR-012
    name: 可退出与可恢复
    statement: 每个流程支持NO_ACTION、PAUSE、CANCEL或RETURN，退出不得偷偷创建下游对象
  - id: BR-013
    name: 目录与事实分离
    statement: Product、Service、Provider、Journey模板是目录主数据，订单、预约、计划与权益是家庭事实
  - id: BR-014
    name: 供给准入
    statement: Provider必须有有效Qualification，Offering与Slot有效后才可接受BookingRequest
  - id: BR-015
    name: 交易权益分离
    statement: Order与Payment成功不自动等同权益可用，FamilyEntitlement由明确政策和事件激活
  - id: BR-016
    name: 审计最小化
    statement: 审计记录动作、策略、对象引用、前后状态和结果，不记录密钥、不必要原文或隐式推理

