    rule: Hypothesis引用Evidence与AiRun，不等于Fact
  - from: OBJ-105
    to: OBJ-106
    cardinality: OPTIONAL_TO_ONE
    rule: 只有家庭确认才能形成GrowthIntent
  - from: OBJ-201
    to: OBJ-203
    cardinality: ONE_TO_MANY
    rule: Journey实例固定模板版本
  - from: OBJ-203
    to: OBJ-204
    cardinality: ONE_TO_MANY
    rule: Journey包含Action实例
  - from: OBJ-204
    to: OBJ-205
    cardinality: ONE_TO_MANY
    rule: Checkin是发生记录而非成长结果
  - from: OBJ-302
    to: OBJ-303
    cardinality: ONE_TO_MANY
    rule: Provider必须有有效Qualification
  - from: OBJ-304
    to: OBJ-305
    cardinality: ONE_TO_MANY
    rule: Offering通过Slot提供可预约容量
  - from: OBJ-306
    to: OBJ-307
    cardinality: ZERO_OR_ONE_TO_ONE
    rule: Booking确认后才创建ServiceCase
  - from: OBJ-401
    to: OBJ-403
    cardinality: ONE_TO_MANY
    rule: Order保留产品与价格版本快照
  - from: OBJ-403
    to: OBJ-404
    cardinality: ONE_TO_MANY
    rule: 一个Order可有多次PaymentAttempt
  - from: OBJ-403
    to: OBJ-405
    cardinality: ZERO_TO_MANY
    rule: 支付与政策共同决定Entitlement激活
  - from: OBJ-405
    to: OBJ-406
    cardinality: ONE_TO_MANY
    rule: 权益使用通过Ledger核销
  - from: OBJ-502
    to: OBJ-503
    cardinality: ONE_TO_MANY
    rule: 草稿发布前必须有最新审核决定
  - from: OBJ-502
    to: OBJ-504
    cardinality: ZERO_OR_ONE_TO_ONE
    rule: 默认私有，明确同意与审核通过后方可发布
  - from: OBJ-602
    to: OBJ-603
    cardinality: ONE_TO_MANY
    rule: 每次AI运行固定最小上下文快照

application_components:
  - id: CMP-APP
    name: Family Mobile App
    layer: EXPERIENCE
    responsibility: 今日行动、计划执行、家庭回读、服务进度、权益与私有草稿
  - id: CMP-CWEB
    name: Consumer Web
    layer: EXPERIENCE
    responsibility: 内容获客、轻量测评、报告预览、账号登录、购买与App引导
  - id: CMP-OWEB
    name: Operations and Advisor Web
    layer: EXPERIENCE
    responsibility: 家庭队列、人工门、内容编排、供给、排班、履约、审核、退款与经营分析
  - id: CMP-API
    name: Family API
    layer: INTERACTION
    responsibility: 身份、范围、投影、Named Action、幂等、错误契约与SSE
  - id: CMP-DOMAIN
    name: Domain Modular Monolith
    layer: DOMAIN_TRUTH
    responsibility: 七领域聚合、状态机、业务规则与PostgreSQL事务
  - id: CMP-WORKFLOW
    name: Workflow and Event Workers
    layer: WORKFLOW_EVENT
    responsibility: Outbox、定时器、重试、暂停恢复、人工等待、21/90天流程与通知编排
  - id: CMP-AI
    name: AI Control Plane
    layer: AI_INTELLIGENCE
    responsibility: 用例注册、上下文、Skill、Gateway、输出验证、评测、审计与Kill Switch
  - id: CMP-CONTEXT
    name: Family Context Platform
    layer: DATA_KNOWLEDGE
    responsibility: 许可范围内的组合、索引、检索、摘要与投影，不拥有业务写权
  - id: CMP-ADAPTER
    name: External Effect Adapters
    layer: INTEGRATION
    responsibility: 支付、消息、日历/视频、对象存储、内容审核与CRM连接
  - id: CMP-OBS
    name: Observability and Governance
    layer: CONTROL
    responsibility: 日志、指标、Trace、审计、成本、安全、数据保留、CI与发布门禁

scenarios:
  - id: SCN-001
    name: 家庭建档、成员关系与同意
    loop: GROWTH
    primary_domain: FAMILY_CORE
    actors: [GUARDIAN, SYSTEM]
    trigger: 已认证账户首次进入或加入家庭
    state_flow: ACCOUNT_AUTHENTICATED -> FAMILY_CONTEXT_REQUIRED -> FAMILY_ACTIVE -> CONSENT_ACTIVE
    success_outcome: 获得受范围约束的FamilyContext
    ui: [UI-01, UI-33]
