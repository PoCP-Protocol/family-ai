    to: OBJ-003
    cardinality: ONE_TO_MANY
    rule: Tenant拥有Account成员关系
  - from: OBJ-003
    to: OBJ-004
    cardinality: MANY_TO_MANY_VIA_BINDING
    rule: Account必须经租户家庭绑定获得FamilyContext
  - from: OBJ-004
    to: OBJ-005
    cardinality: ONE_TO_MANY
    rule: Family包含Person
  - from: OBJ-004
    to: OBJ-008
    cardinality: ONE_TO_MANY
    rule: Family拥有按目的区分的Consent
  - from: OBJ-101
