schema_version: AI_USE_CASE_CODE_MAPPING_V1
architecture_id: FAMILY_AI_PLATFORM_V4_1
purpose: >
  Bridges two independently-evolved vocabularies that currently have no explicit
  mapping: the business-level AI Use Case Registry (governance/FAMILY_AI_USE_CASE_REGISTRY_V1.yaml,
  7 entries) and the page-level Family LLM Gateway use cases (apps/api/src/modules/orchestration/llm-gateway/family-llm-page-policy.ts,
  8 entries covering UI-01..UI-34). Per architecture/GENERATIVE_AI_SYSTEM_ASSESSMENT_2026-08-28.md
  section 4, this mapping did not exist before this file — audit coverage could not be confirmed.
status: ASSESSMENT_DERIVED_MAPPING
notes:
  - This file records CURRENT REALITY (what code actually calls, what registry status actually is).
    It does not itself authorize anything. Runtime authorization remains governed solely by
    governance/AUTHORIZATION_REGISTRY.yaml and governance/FAMILY_AI_USE_CASE_REGISTRY_V1.yaml.
  - "registry_use_case_id values with no code_paths entry mean no implementation found in this
    codebase as of 2026-08-28 (see gaps section)."
  - page_use_case_id values are FamilyLlmUseCase literals from family-llm.contract.ts, consumed by
    family-llm-page-policy.ts across UI-01..UI-34.

