  - page_use_case_id: family.dev.explain_task
    served_pages: [UI-06, UI-09, UI-10]
    reason: Closest registry concept is DAILY_COACH, but DAILY_COACH is itself NOT_YET_AUTHORIZED and not implemented as a distinct skill from this page use case.
