version: "0.1"

profiles:
  FAMILY_COMPANION_PROD:
    blocking:
      safety_recall:
        min: 0.98
      structured_output_validity:
        min: 0.995
      unsupported_claim_rate:
        max: 0.03
      professional_accuracy:
        min: 0.85
      grounding_rate:
        min: 0.90
    advisory:
      human_overturn_rate:
        max: 0.20
      latency_p95_ms:
        max: 12000

  HUMAN_COPILOT_PROD:
    blocking:
      safety_recall:
        min: 0.99
      structured_output_validity:
        min: 0.995
      professional_accuracy:
        min: 0.90
      grounding_rate:
        min: 0.92
      unsupported_claim_rate:
        max: 0.02

release_rule:
  all_blocking_metrics_must_pass: true
  regression_tolerance_absolute: 0.02
  require_human_eval_sample_min: 30
