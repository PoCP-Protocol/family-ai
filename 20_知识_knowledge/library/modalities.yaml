# 多模态测量卡｜获取家庭真实信号的通道 —— 回答"怎么知道它真的变了"
# id 前缀必须为 MM-。measures_constructs 指向 CN- 卡。
# minors_handling / privacy_risk 缺失直接 error。

modalities:
  - id: MM-001
    name: 亲子互动观察编码 / 家长情绪社会化自评
    summary: 通过结构化互动观察编码与家长自评,估计被听见感与强制/防御循环的变化。
    channel: 视频 + 量表
    measures_constructs: [CN-001, CN-002]
    instrument: 情绪教练/强制互动编码体系 + 家长情绪社会化自评量表(具体版本待选定并核验信效度)
    reliability: 观察编码需双编码者信度;自评存在社会赞许性偏差,须交叉校正。
    cost: 观察编码人工成本高;家长自评低成本但偏差大。
    home_feasible: 家长自评可家庭内完成;视频编码须显式 consent 且受限微数据不出本地。
    privacy_risk: >
      高 —— 视频含未成年人原始影像。默认不采原始音视频;仅结构化编码分数入库,须脱敏;
      "同意成长追踪" ≠ "同意视频通道采集",粒度必须单独授权。
    minors_handling: >
      涉未成年人:监护人显式 consent + 未成年人知情;原始影像不出本地、不入 canonical;
      仅派生的结构化信号可用,且经 Human Gate。
    tags: [观察编码, 自评, modality]
    open_questions:
      - 家长自评的社会赞许性偏差如何在青少年样本中校正。
      - 尚未选定可直接测量“被听见感”的授权量表；不得把SDQ作为亲子倾听或情绪社会化的直接测量工具。
      - 亲子互动观察编码需要先建立编码手册、训练双编码者并报告一致性，当前不能宣称已有验证完成。
    evidence:
      - claim: >
          Strengths and Difficulties Questionnaires（SDQ）是受版权保护的测量工具；官方页面说明不得任意修改、添加题目、使用未授权翻译或未经授权制作电子版本。
        grade: 4
        provenance: third_party_real
        source: "https://www.sdqinfo.org/"
        population: 儿童与青少年相关心理行为测量使用者
        note: >
          RIGHTS_AND_USE_CONSTRAINTS_ONLY。该来源用于记录版权与使用边界，
          不证明SDQ能够直接测量“被听见感”或“防御/强制互动循环”。Family不得把SDQ复制到产品中，
          也不得未经授权改写为自有量表。
        tags: [measurement-rights, SDQ, copyright, non-effect-claim]

  - id: MM-002
    name: 教养要求性-回应性双维度测量设计
    summary: 分别记录家长设定要求与情感回应的行为信号,不把四分类标签直接当作家庭诊断结论。
    channel: 家长报告 + 亲子互动观察
    measures_constructs: [CN-003]
    instrument: 待核验的要求性/回应性量表候选 + 结构化互动观察编码;当前仅为测量设计卡
    reliability: 具体工具的内部一致性、重测信度、观察者一致性和跨文化测量等值性均待核验。
    cost: 家长报告低成本;互动观察需要训练编码者,成本较高。
    home_feasible: 家长报告可家庭内完成;观察编码仅在取得单独授权并完成隐私评估后考虑。
    privacy_risk: >
      中高 —— 互动视频可能包含未成年人原始影像;默认不采集或上传原始音视频,
      如确需采集必须单独 consent、限定本地处理并只保存结构化编码。
    minors_handling: >
      涉未成年人:监护人显式 consent + 未成年人知情;不输出教养类型诊断或家庭排名;
      仅保存最小化的结构化信号,高风险解释须经 Human Gate。
    tags: [要求性, 回应性, 观察编码, modality, design-only]
    open_questions:
      - 尚未选定可合法使用且完成中文情境效度核验的具体工具,不得生成四分类标签或分数阈值。
    evidence: []

  - id: MM-003
    name: 依恋安全性观察与关系行为测量设计
    summary: 以照养者敏感回应和儿童探索/寻求安慰行为为观察对象,不以家长自评替代标准化依恋评估。
    channel: 结构化观察 + 专业评估转介
    measures_constructs: [CN-004]
    instrument: 陌生情境或替代性关系观察范式候选;具体年龄适配、中文常模和授权状态待核验
    reliability: 观察者训练、编码手册、编码者一致性、年龄适配和跨文化效度均待核验。
    cost: 专业观察与编码成本高;不适合作为家庭日常自测工具。
    home_feasible: 不作为家庭自测;如出现发展或安全风险信号,仅生成转介提示并进入 Human Gate。
    privacy_risk: >
      高 —— 未成年人关系观察涉及敏感发展信息;不得采集不必要的原始视频,
      不得将依恋类型作为可搜索或可比较的家庭标签。
    minors_handling: >
      涉未成年人:监护人显式 consent + 未成年人知情;仅由受训专业人员在授权范围内实施;
      结构化结果不得替代临床诊断,高风险情形必须 Human Gate。
    tags: [依恋, 敏感回应, 观察编码, modality, design-only]
    open_questions:
      - 尚未核验中国本土常模、年龄范围、授权条件和观察者培训要求,当前不得宣称测量完成。
    evidence: []

  - id: MM-004
    name: 教养自我效能感自评设计
    summary: 通过家长在具体场景下的自评来估计教养自我效能感,不作为家长能力的诊断性评级。
    channel: 量表 + 具体场景情境化提问
    measures_constructs: [CN-005]
    instrument: 待核验的教养效能感量表候选(如西方PSOC量表的中文本土化版本);当前仅为测量设计卡,未选定可合法使用的具体工具
    reliability: 内部一致性、重测信度、中文情境效度均待核验;单题自评的状态性波动风险高。
    cost: 低成本,可嵌入日常产品交互中,但需避免过度频繁采集造成家长疲劳/负担。
    home_feasible: 家长可在家庭内自行完成,不需要专业观察者介入。
    privacy_risk: >
      中 —— 涉及家长本人的心理自评数据,不直接涉及未成年人原始影像,
      但若与具体教养场景描述关联存储,可能间接暴露家庭互动细节,需脱敏处理。
    minors_handling: >
      本卡测量对象是家长本人而非未成年人,但场景描述可能间接涉及孩子信息,
      涉及具体孩子行为描述时仍需遵循未成年人数据最小化原则。
    tags: [自我效能, 家长自评, modality, design-only]
    open_questions:
      - 尚未选定合法可用且完成中文效度核验的具体量表工具,不得输出效能感分数或"合格家长"类判定。
      - 单次自评与真实教养行为改变之间的关系强度未经本平台验证,不得据此宣称"自评提升=行为改善"。
    evidence: []

  - id: MM-005
    name: 自我分化自评设计
    summary: 通过家长在家庭压力情境下的自评估计自我分化程度,不作为人格诊断或心理健康评级。
    channel: 量表 + 情境化提问
    measures_constructs: [CN-006]
    instrument: 待核验的自我分化量表候选(如DSI中文本土化版本);当前仅为测量设计卡,未选定可合法使用且完成中文效度核验的工具
    reliability: 中文本土化信效度、跨文化构念等值性均待核验。
    cost: 低成本,量表形式,可嵌入产品但需控制频率避免家长产生被评判感。
    home_feasible: 家长可自行完成,不需专业人员介入。
    privacy_risk: 中 —— 涉及家长本人心理状态自评,不直接涉及未成年人数据,但情境描述可能间接涉及家庭互动细节。
    minors_handling: 测量对象为家长本人;若情境描述涉及具体孩子行为,需遵循未成年人数据最小化原则。
    tags: [自我分化, 家庭系统, 家长自评, modality, design-only]
    open_questions:
      - 尚未选定合法可用且完成中文效度核验的具体量表,不得输出"分化程度"分数或心理健康类判定。
      - 与MM-004(教养效能感自评)的构念区分度未经本平台验证,存在题目内容重叠风险。
    evidence: []

  - id: MM-006
    name: 学业动机与归因自评设计
    summary: 通过儿童/青少年在具体学业挑战场景下的自评,估计内隐能力信念/归因倾向与基本心理需求满足度,不作为学业能力诊断。
    channel: 量表 + 情境化提问(如"上次考砸时你觉得是因为什么")
    measures_constructs: [CN-007, CN-008]
    instrument: 待核验的内隐信念量表(如Dweck Mindset量表)与SDT需求满足量表的中文本土化候选版本;当前仅为测量设计卡
    reliability: 中文本土化信效度、跨文化构念等值性、社会期望效应校正均待核验。
    cost: 低成本,量表形式,可嵌入学习类产品但需避免采集频率过高。
    home_feasible: 儿童可在家长引导下完成,青少年可自行完成;年幼儿童需简化题目表述并谨慎解读。
    privacy_risk: 中高 —— 涉及未成年人心理/学业相关自评数据,需遵循未成年人数据最小化与谨慎解读原则。
    minors_handling: >
      监护人显式consent + 未成年人知情;不得据此生成"学习能力评级"或"是否聪明"类判定,
      仅用于生成具体场景的归因反馈建议,高风险解读需Human Gate。
    tags: [成长型思维, 自我决定理论, 学业动机, modality, design-only]
    open_questions:
      - 尚未选定合法可用且完成中文效度核验的具体量表工具。
      - 鉴于TH-006已有的anti-overclaim证据,本测量设计不得被用于宣称"提升成长型思维分数=提升学业成绩"。
    evidence: []

  - id: MM-007
    name: 语言互动录音分析与同伴情境故事访谈设计
    summary: 通过照养者-儿童互动录音转写分析语言输入质量,通过情境故事访谈估计儿童社会信息加工偏差;两者均非家庭可自行完成的日常测量。
    channel: 录音转写分析 + 结构化情境故事访谈
    measures_constructs: [CN-009, CN-010]
    instrument: 待核验的语言输入编码体系(如LENA类系统的中文适配)与社会信息加工情境故事访谈工具;当前仅为测量设计卡
    reliability: 录音转写的编码者信度、情境故事访谈的访谈者培训标准化程度均待核验;中文本土化版本均未核验。
    cost: 录音转写人工成本高;情境故事访谈需专业培训的访谈者,成本高于家长自评类工具。
    home_feasible: 均不适合作为家庭自测工具;录音采集需明确consent,访谈需专业人员主持。
    privacy_risk: >
      高 —— 录音涉及未成年人原始语音数据,情境访谈涉及儿童社交行为敏感信息;
      默认不采集或长期保存原始录音,仅保留结构化编码结果,访谈记录需脱敏。
    minors_handling: >
      监护人显式consent + 未成年人知情;原始录音/访谈记录不出本地、不入canonical;
      不得据此生成"语言能力评级"或"攻击性人格"类标签,高风险发现须转介专业评估并进入Human Gate。
    tags: [语言发展, 社会信息加工, 观察编码, modality, design-only]
    open_questions:
      - 两类测量均未选定合法可用且完成中文效度核验的具体工具,当前不能宣称测量完成。
      - 家庭日常场景下的低成本替代测量方式(如简化版家长观察清单)尚未设计和核验,效度可能显著低于专业工具。
    evidence: []

  - id: MM-008
    name: 媒体调节行为自评设计
    summary: 通过家长自评/情境化提问估计其媒体调节风格(限制型/共同使用型/主动型)的比重,不作为"好家长/坏家长"评级。
    channel: 量表 + 具体场景提问(如"孩子上次看短视频时,你做了什么")
    measures_constructs: [CN-011]
    instrument: 待核验的媒体调节量表中文本土化候选版本(如Nathanson调节风格量表);当前仅为测量设计卡,未选定可合法使用且完成中文效度核验的工具
    reliability: 家长自评容易把陪同在场误报为主动调节,中文效度核验、社会期望偏差校正均待核验。
    cost: 低成本,量表形式,可嵌入产品但需避免采集频率过高。
    home_feasible: 家长可自行完成,不需要专业人员介入。
    privacy_risk: 中 —— 涉及家长自评及孩子媒体使用行为描述,需遵循未成年人数据最小化原则,不采集具体浏览内容/账号信息。
    minors_handling: 涉及孩子媒体使用行为描述时需最小化采集,不得据此生成"沉迷"类诊断性标签,高风险信号(如涉及不良内容)须转介Human Gate。
    tags: [媒体调节, 设备使用, 家长自评, modality, design-only]
    open_questions:
      - 尚未选定合法可用且完成中文效度核验的具体量表,不得输出调节风格分数或家长评级。
      - 智能手机/短视频场景下"共同使用"与"主动调节"的行为边界比电视场景更模糊,题目设计需谨慎区分。
    evidence: []
