# 构念卡｜可测量的中间变量 —— 回答"到底在改变什么"
# id 前缀必须为 CN-。grounded_in 指向 TH- 卡;measured_by 指向 MM- 卡。
# 校验器:没有测量通道 = error;没有理论根 = error。
#
# 【多次反复出现"概念重叠尚未厘清"后的一次性梳理,2026-08-28】
# 本库家长/亲子相关构念分属四个不同分析层级,层级不同即不是同一构念,不需要合并测量:
#   层级A 家长个体信念/特质层(跨场景,不针对某次具体互动):CN-005(教养效能感,任务特定信念)、CN-006(自我分化,一般性情绪调节特质,非教养专属)
#     → CN-005 与 CN-006 的区别:CN-005 问"我信不信自己能处理好教养任务",CN-006 问"压力下我能不能不被情绪淹没、还保持独立思考"——
#       前者是domain-specific认知信念,后者是跨情境的情绪调节能力,理论上CN-006低会侵蚀CN-005(压力下即使有技巧也执行不出来),两者是因果相关而非同一构念。
#   层级B 家长个体行为层(可观察的具体教养行为模式):CN-003(教养要求性-回应性,规则设定与情感回应的联合水平)
#   层级C 亲子二元互动层(需要双方在场才能观察的互动模式):CN-002(强制/防御互动循环)
#   层级D 孩子主观体验/结果层(孩子端的感受或需求满足状态):CN-001(被听见感,窄:限定在被倾听这一具体体验)、
#     CN-008(三需求满足度,宽:自主/胜任/归属三维度的动机需求满足,被听见感可视为归属感需求满足的一种具体表现,但CN-008覆盖面更广不能互相替代)
#   CN-004(依恋安全性)、CN-007(内隐能力信念)、CN-009(语言输入质量)、CN-010(社会信息加工偏差)各自锚定独立理论(TH-003/006/008/009),
#     与上述四层无直接概念重叠,不需要纳入此次梳理。
# 因果假设链(非实证验证,是本平台的理论推演路径,标注在此供后续设计参考):CN-006/CN-005(层级A,家长个体)
#   → 影响家长能否稳定做出 CN-003(层级B,行为)→ 影响 CN-002 是否升级为强制循环(层级C,互动)
#   → 最终影响孩子体验到的 CN-001/CN-008(层级D,孩子端结果)。

constructs:
  - id: CN-001
    name: 被听见感(felt-listening)
    summary: 说话者感到对方真的听懂其在意的点,而非急于评价或纠正。
    definition: 亲子沟通中,子女主观感到父母接住了其情绪与关切的程度。
    grounded_in: [TH-001]
    measured_by: [MM-001]
    direction: 越高越好
    proxy_risk: 用"家长自评"测会高估;应尽量取子女视角或第三方观察编码。
    tags: [倾听, 情绪, construct]
    open_questions:
      - 该构念当前直接实证有限,不得过度赋级(DO NOT OVERGRADE)。
    # 证据有限:暂不挂 decisive 证据(诚实留空,strongest=E0),待直接测量研究补入。
    evidence: []

  - id: CN-002
    name: 防御/强制互动循环(coercive loop)
    summary: 一方开口另一方即防御/顶嘴/退出,双方都更难继续对话,冲突自我强化。
    definition: 家庭互动中可观察的强制/防御性往复模式(coercive family process)。
    grounded_in: [TH-001]
    measured_by: [MM-001]
    direction: 越低越好
    proxy_risk: 单靠家长回忆易漏报;宜用互动观察编码。
    tags: [冲突, 强制循环, construct]
    open_questions:
      - 早期儿童样本的强制循环证据外推到 12-15 岁青少年 = LIMITED。
    evidence:
      - claim: >
          可观察的强制/防御性亲子互动循环与后续对立/不顺从行为相关(强制家庭过程,观察性证据)。
        grade: 6
        provenance: third_party_real
        source: "doi:10.1017/S0954579414000169"
        year: 2014
        sample_n: 731
        population: 2 岁至入学儿童及其照顾者(早期儿童)
        note: >
          CONSTRUCT_SUPPORT;观察性(E6)。适用限制:早期儿童样本,外推到青少年 LIMITED;
          仅证明"强制/防御循环是可实证观察的家庭过程",不证明"12-15 岁所有顶嘴都源自强制循环"。
        tags: [construct-support, coercive-process, observational, early-childhood, generalization-limited]

  - id: CN-003
    name: 教养要求性-回应性平衡(authoritative balance)
    summary: 家长在"设定规则/要求"与"情感回应/尊重孩子需求"两个维度上是否同时保持在较高水平。
    definition: 可观察的家长教养行为中,要求性(设规则/督促/一致执行)与回应性(情感支持/倾听/尊重自主)两个维度的联合水平。
    grounded_in: [TH-002]
    measured_by: [MM-002]
    direction: 两维度同时较高(权威型区域)为佳,单维度极端(专制/放纵/忽视)风险更高。
    proxy_risk: >
      家长自评容易高估自己的回应性;且西方量表条目直译到中文情境可能把"高要求"系统性误判为"专制",
      须结合中国家庭常见的高要求+高情感投入模式做本土化校正,不能直接套用西方量表分数分类。
    tags: [教养方式, 要求性, 回应性, construct]
    open_questions:
      - 该构念目前复用MM-001(家长自评为主)测量,尚无本平台自己核验过的中文本土化量表条目,自评偏差风险高于CN-001/CN-002。
    evidence: []

  - id: CN-004
    name: 依恋安全性(attachment security)
    summary: 婴幼儿在照养者敏感回应下形成的"能安心探索、遇险能有效寻求安慰"的关系品质。
    definition: 婴儿/儿童在陌生情境等标准化范式下表现出的探索-寻求安慰平衡程度,反映其与照养者关系的安全程度。
    grounded_in: [TH-003]
    measured_by: [MM-003]
    direction: 越安全(高)越好;回避型/焦虑型/混乱型依恋模式风险更高。
    proxy_risk: >
      标准化"陌生情境"范式在中国家庭(多照养者、非母亲主要照养常见)中的直接适用性未经本平台核验;
      家长自评量表存在社会赞许性偏差,不能替代观察编码。
    tags: [依恋, 安全感, construct]
    open_questions:
      - 本平台尚无自己核验过的中文依恋测量工具/常模,当前只能复用MM-001泛用观察编码/自评渠道,精确度不足以支撑个体诊断结论。
    evidence: []

  - id: CN-005
    name: 教养自我效能感(parenting self-efficacy)
    summary: 家长对"自己能否有效应对具体教养挑战"的主观信念强度,是"家长第二次成长"维度的核心可测量中间变量。
    definition: 家长在具体教养场景(如应对孩子情绪爆发、坚持规则执行)中对自身胜任程度的主观评估。
    grounded_in: [TH-004]
    measured_by: [MM-004]
    direction: 越高越好,但需警惕"虚高自评"(未经真实场景检验的过度自信)与"低估"(有实际能力但缺乏信心)两种偏差方向。
    proxy_risk: >
      自评量表容易受近期单次成功/失败经历过度影响,产生状态性波动而非稳定特质测量;
      社会赞许性偏差可能导致家长在自评中呈现比实际更高的效能感。
    tags: [自我效能, 家长成长, construct]
    open_questions:
      - 尚未选定/核验中文本土化教养效能感量表(如PSOC等西方量表的中文版效度),当前无法给出可信的个体分数。
    evidence: []

  - id: CN-006
    name: 自我分化(differentiation of self)
    summary: 家长在家庭情绪系统中,能否区分自己的理性思考与情绪反应,并在保持亲密的同时不过度融合或疏离。
    definition: 个体在人际压力/家庭情绪张力下,维持独立思考与情感联结平衡的能力程度。
    grounded_in: [TH-005]
    measured_by: [MM-005]
    direction: 越高越好;过度融合(丧失边界)与过度疏离(情感切断)均为低分化的两种表现形式。
    proxy_risk: >
      西方DSI量表条目在集体主义文化下的构念等值性未经本平台核验;
      家长自评"我情绪很稳定"可能与实际压力情境下的真实反应不一致,存在社会赞许性偏差。
    tags: [家庭系统, 自我分化, 家长成长, construct]
    open_questions:
      - 与CN-005/CN-001/CN-002的层级区分已梳理(见本文件顶部2026-08-28梳理注:CN-006是层级A家长个体特质,与层级B/C/D不同层),不再是"尚未厘清"状态;仍未解决的是中文DSI量表本身的效度核验。
    evidence: []

  - id: CN-007
    name: 内隐能力信念与努力归因(implicit ability belief / effort attribution)
    summary: 儿童/青少年对"能力能否通过努力改变"的信念,以及面对失败时倾向归因于努力/策略不足还是能力不够。
    definition: 个体在具体学业挑战场景中,对自身能力可塑性的信念强度,及其对失败原因的归因倾向。
    grounded_in: [TH-006]
    measured_by: [MM-006]
    direction: 越倾向"能力可通过努力改变+失败归因于努力/策略"越有利于坚持性,但本构念与"实际学业成绩"的关联效应量小,不得作为成绩预测指标使用。
    proxy_risk: >
      自评量表容易受"社会期望回答"影响(学生知道"说努力比说天赋政治正确");
      单次测量的信念表述可能与真实挑战情境下的实际归因行为不一致。
    tags: [成长型思维, 归因, 学业动机, construct]
    open_questions:
      - 本构念与实际学业成绩改善之间的因果链条证据薄弱(见TH-006的anti-overclaim证据),生成建议时不得暗示"改变信念=提分"。

  - id: CN-008
    name: 基本心理需求满足度(autonomy/competence/relatedness satisfaction)
    summary: 个体感受到的自主性、胜任感、归属感三种基本心理需求被满足的程度,是内在动机维持的核心中间变量。
    definition: 个体在具体环境(如家庭/学习场景)中,对自身选择自由度、能力胜任感、与重要他人情感联结的主观感受强度。
    grounded_in: [TH-007]
    measured_by: [MM-006]
    direction: 三个维度都越高越好;单一维度过低(如高胜任感但零自主性)仍可能整体动机受损,不能只看总分。
    proxy_risk: >
      三维度概念上部分重叠(如"归属感"高可能连带拉高"自主性"自评),量表条目设计需要仔细区分。
    tags: [自我决定理论, 内在动机, construct]
    open_questions:
      - 中文本土化SDT量表尚未核验。
      - 与CN-003/CN-005的层级区分已梳理(见本文件顶部2026-08-28梳理注:CN-008是层级D孩子主观结果,CN-003是层级B家长行为,CN-005是层级A家长信念;
        CN-008与CN-001同属层级D但覆盖面不同,CN-008更宽,不是同一构念的重复测量)。

  - id: CN-009
    name: 照养者语言输入质量(caregiver language input quality)
    summary: 照养者对幼儿说话时的词汇多样性、句法复杂度、对话式互动比例的综合水平。
    definition: 可观察的照养者言语行为中,词汇丰富度/句法复杂度/对话式跟进/去情境化语言四个维度的综合表现。
    grounded_in: [TH-008]
    measured_by: [MM-007]
    direction: 越高越好;单向指令式/低词汇多样性的语言输入模式风险更高。
    proxy_risk: >
      家长自评倾向高估自己的语言互动质量;真实测量通常需要录音转写分析,家庭场景成本高;
      不同方言/多语言环境下的"词汇多样性"计算方式未经本平台核验统一标准。
    tags: [语言发展, 照养者语言输入, construct]
    open_questions:
      - 本构念的测量高度依赖录音转写分析,家庭日常场景的低成本替代测量方式尚未核验。

  - id: CN-010
    name: 社会信息加工偏差(social information processing bias)
    summary: 儿童在编码-解读-目标设定-应对生成-评估-执行六步骤中出现的系统性偏差程度,尤其敌意归因偏差与应对方式生成局限。
    definition: 儿童面对模糊/冲突性社交情境时,在信息加工特定步骤上表现出的偏差模式(如把中性线索解读为敌意、只能生成攻击性应对方式)。
    grounded_in: [TH-009]
    measured_by: [MM-007]
    direction: 偏差程度越低越好;需定位到具体哪个加工步骤出现偏差,不能只用一个笼统总分描述。
    proxy_risk: >
      标准化测量通常用情境故事访谈法(如给儿童讲模糊冲突场景故事,问其反应),对访谈者培训要求高;
      家长报告的孩子"社交问题"描述往往笼统(如"爱打人"),不能直接等同于加工步骤定位。
    tags: [同伴关系, 社会认知, 攻击行为, construct]
    open_questions:
      - 中文本土化情境故事访谈工具尚未核验;本构念不得用于替代专业行为问题评估。
