# 方法卡｜可执行到家庭日常粒度的动作 —— 回答"今晚这个家庭具体做什么"
# id 前缀必须为 MD-。grounded_in→TH-(必填);targets_constructs→CN-(必填)。
# risk_level 中/高却无 human_requirement = error。

methods:
  - id: MD-001
    name: 先连接再纠正(情绪教练式回应)
    summary: 先让对话能继续(承接情绪/复述/低防御提问),再进入规则或纠正。
    grounded_in: [TH-001]
    targets_constructs: [CN-001, CN-002]
    steps:
      - 孩子开口时先不打断,听完整段;
      - 承接并命名情绪("听起来你觉得…"),复述你听到的要点,问"我理解对吗";
      - 得到确认后再表达看法或进入规则。
    dose: 每日 1 次晚间对话,连续 2 周
    age_range: 12-15
    observable_signal: 孩子主动开口次数增加;被打断后的沉默变短;顶撞升级频次下降。
    contraindication: 涉即时人身危险/暴力升级/自伤等不适用,须直接进入 Human Gate 转人工/专业支持。
    failure_mode: 把"复述"做成"审问";复述后立刻接"但是";用倾听换取顺从。
    risk_level: low
    human_requirement: none
    tags: [倾听, 沟通, 情绪教练, method]
    open_questions:
      - 微动作(今晚复述一句)本身的直接效果证据仍有限;方法效果主要来自情绪教练式家长干预的整体证据。
    evidence:
      - claim: >
          情绪聚焦的家长干预(Tuning in to Teens)可改善家长情绪社会化实践,
          并可能降低家庭冲突 / 青少年外化问题(以学校为单位随机分配)。
        grade: 7
        provenance: third_party_real
        source: "doi:10.1016/j.adolescence.2015.04.005"
        year: 2015
        sample_n: 225
        population: 主要照顾者(225)与青少年(224);学校随机分配干预/控制
        note: >
          METHOD_EFFECT;DIRECT_OR_NEAR_DIRECT。claim 已收窄:支持"情绪教练式家长干预"方向,
          不等于"先听再回应一定有效"或"今晚复述一句必然改善关系"。
        tags: [method-effect, RCT, adolescence, emotion-socialization, tuning-in-to-teens]
      - claim: >
          在同一随机分配设计的数据上,家长情绪觉察/调节与情绪社会化的变化,中介了青少年内化问题的改善。
        grade: 6
        provenance: third_party_real
        source: "doi:10.1037/dev0000875"
        year: 2020
        population: 青少年家长(TinT 机制分析)
        note: >
          MECHANISM_SUPPORT。claim-specific 降级为 E6:整个试验是随机的,但"中介机制本身"
          不因原研究是 RCT 就自动被解释为完全因果。不做 paper=RCT → every claim=E7。
        tags: [mechanism-support, mediation, adolescence, tuning-in-to-teens]

  - id: MD-002
    name: 立规则先解释理由,执行再保持一致(权威型教养践行法)
    summary: 设定行为规则时先说明理由并留出协商空间,一旦确定就一致执行;同时保证每天有一段不谈规则、只谈孩子感兴趣的事的相处时间。
    grounded_in: [TH-002]
    targets_constructs: [CN-003]
    steps:
      - 提出新规则或纠正行为前,先用一句话说明理由("这样做是因为…"),给孩子机会提问或提出困难;
      - 规则确定后一致执行,不因当下心情/场合随意放宽或收紧(避免让孩子觉得规则可以靠情绪拗动家长);
      - 每天留出至少15分钟,只做孩子选的、跟"规矩/学习"无关的活动,专注陪伴不夹带说教。
    dose: 规则解释与协商随事件发生;高质量陪伴时间每日1次、每次15分钟,连续2周观察变化
    age_range: 3-15
    observable_signal: 孩子主动提出异议/协商的次数增加而非直接顶撞或沉默服从;规则执行时的对抗强度下降。
    contraindication: 涉及安全底线(如人身安全、法律红线)的规则不适用"协商"步骤,须清晰不可谈判并说明原因,不进入Human Gate但不可弱化为纯粹协商姿态。
    failure_mode: 把"解释理由"做成冗长说教;"一致执行"变成完全不容许例外的僵化;高质量陪伴时间里忍不住夹带教育/纠正。
    risk_level: low
    human_requirement: none
    tags: [教养方式, 权威型, 一致性, method]
    open_questions:
      - 本方法卡的具体步骤(15分钟陪伴/解释理由话术)是本平台从TH-002理论机制推导出的操作化设计,尚无独立RCT验证这套具体流程本身的效果,效果假设建立在Baumrind理论关联证据基础上,非直接效应证据。

  - id: MD-003
    name: 敏感回应练习(察觉-解读-回应-调节)
    summary: 照养者按"察觉信号→正确解读→及时回应→回应强度匹配需求"四步骤练习对婴幼儿信号的敏感回应,不追求完美只追求"大部分时候在场"。
    grounded_in: [TH-003]
    targets_constructs: [CN-004]
    steps:
      - 婴幼儿发出信号(哭闹/表情/姿态变化)时先停下手上的事,专注察觉,不急着猜测或忽略;
      - 尝试判断信号背后的需求(饿/累/要抱/过度刺激想独处),不确定时用排除法逐一尝试而非固定套用一种解释;
      - 在信号出现后的合理时间窗内做出回应,不要求"立刻"但避免长时间放任不管;
      - 回应强度匹配需求本身(轻微不适给安抚,强烈痛苦给更强支持),避免"一刻不停地包办"或"完全不回应等孩子自己平静"两种极端。
    dose: 日常持续练习,建议每周回顾1次"这周有没有哪次信号我没接住/接住了但用错方式"
    age_range: 0-3
    observable_signal: 婴幼儿在照养者回应后能相对更快平复;照养者对信号的"猜错-调整"能力(察觉猜错后能及时换一种回应方式)提升。
    contraindication: 若信号伴随发热/外伤/异常持续哭闹等健康风险迹象,不适用本方法的"猜测-尝试"框架,须直接就医,不得用敏感回应练习替代医疗判断。
    failure_mode: 把"及时回应"做成"一刻不能等的立即响应"造成照养者过度耗竭;把"恰当性"理解成物质满足(玩具/零食)而非情感需求匹配。
    risk_level: low
    human_requirement: none
    tags: [依恋, 敏感回应, 照养行为, method]
    open_questions:
      - 本方法卡步骤是从TH-003"敏感回应"构念直接操作化,尚无独立干预研究验证这套具体练习流程本身的效果量。

  - id: MD-004
    name: 家长自我效能感"小成功"练习法
    summary: 家长从一个具体、可控、大概率能成功的教养场景开始practice,刻意积累"掌握经验",而不是从最难的场景(如青春期激烈冲突)开始尝试新方法。
    grounded_in: [TH-004]
    targets_constructs: [CN-005]
    steps:
      - 从近期教养困扰里,挑一个"频率较高但强度较低"的场景(如晚饭后收拾书包磨蹭),而非最激烈的冲突场景;
      - 只在这一个场景里尝试一种新的应对方式,连续尝试3-5次,不同时改变多个场景/多种方法;
      - 每次尝试后简单记录"这次有没有比上次顺利一点",不要求完美,只要求"看到一点点变化的证据";
      - 有条件时,找一位处境相似的家长交流具体做法(替代性经验),优先看"真实但不完美"的示范而非理想化案例。
    dose: 每次聚焦1个场景,连续尝试3-5次为一个周期,周期结束后再决定是否换场景
    age_range: 不针对孩子年龄,适用于任何有教养困扰的家长
    observable_signal: 家长对该具体场景的主观信心提升(哪怕行为结果只有小幅改善);家长开始主动谈论"我上次做到了"而非只谈"孩子还是不听"。
    contraindication: 若家长当下处于严重情绪耗竭/抑郁焦虑症状,不适用"自我挑战"类练习,应优先转介专业心理支持,不得把效能感练习当作替代治疗手段。
    failure_mode: 一次性挑战多个高难度场景导致挫败反而降低效能感;把"记录变化"做成自我批评清单。
    risk_level: low
    human_requirement: none
    tags: [自我效能, 家长成长, 掌握经验, method]
    open_questions:
      - 本方法卡直接操作化Bandura四来源理论中的"掌握经验"路径,是本平台基于理论机制的设计,尚无独立效果验证。

  - id: MD-005
    name: 情绪暂停后坚持立场练习(自我分化练习)
    summary: 家庭冲突场景中,先识别自己的情绪唤起状态并短暂暂停,再用平稳的语气坚持自己的立场,既不因情绪激动而升级对抗,也不因避免冲突而完全让步或情感抽离。
    grounded_in: [TH-005]
    targets_constructs: [CN-006]
    steps:
      - 察觉自己在冲突中的身体信号(心跳加快/声音变大/想立刻回应),把这当作"先暂停"的提示而非"必须立刻反应"的信号;
      - 给自己一句简短的暂停语("我需要想一下,一分钟后再说"),离开或沉默几十秒到几分钟,不使用暂停来逃避后续沟通;
      - 暂停后用平稳语气重新表达自己的立场(可以坚持,也可以调整,但不因情绪被牵动而临时改变原本判断);
      - 明确区分"我不同意你"与"我不要你"——坚持立场的同时,用语言/动作确认关系连接没有断("我们意见不一样,但我还是想和你一起解决")。
    dose: 每次冲突场景中练习,建议先从低强度冲突(如日常小摩擦)开始,不建议首次练习就用在最激烈的家庭矛盾上
    age_range: 家长自身练习,不针对孩子年龄
    observable_signal: 冲突中"暂停后能回来继续沟通"的次数增加;情绪化对抗或完全回避沉默的比例下降。
    contraindication: >
      涉及家庭暴力、持续性情感虐待、酒精/物质滥用相关冲突等,不适用本自我调节练习框架,
      须直接转介专业家庭治疗/危机干预资源,进入Human Gate,不得把"暂停后坚持立场"当作应对暴力风险的替代方案。
    failure_mode: 把"暂停"做成"冷战式回避"(暂停后不再回来沟通);把"坚持立场"做成"不听对方说什么只顾表达自己"。
    risk_level: medium
    human_requirement: review
    tags: [自我分化, 家长成长, 情绪调节, method]
    open_questions:
      - 本方法卡直接操作化TH-005自我分化构念,尚无独立干预研究验证这套具体练习流程的效果;risk_level定为medium是因为该场景本身(家庭冲突)存在升级风险,而非练习本身有害,human_requirement=review作为审慎默认。

  - id: MD-006
    name: 过程/策略聚焦反馈法(努力归因练习)
    summary: 家长在孩子完成任务或遇到挫折时,把反馈重点放在具体的方法/努力过程上,而不是笼统评价孩子聪明/笨,帮助孩子形成"结果不好是方法还需调整"而非"我能力不够"的归因习惯。
    grounded_in: [TH-006]
    targets_constructs: [CN-007]
    steps:
      - 孩子完成任务后,先具体描述你观察到的做法("我看到你先把大题目分成了几小步"),不用"聪明/真棒"这类笼统评价性词语;
      - 孩子遇到挫折/失败时,先共同回顾具体过程("这次卡在哪一步了"),避免直接给"你是不是没努力/是不是能力不够"这类归因判断;
      - 引导孩子自己说出"下次可以换个方法试试"，家长补充1-2个具体可尝试的策略,而不是空泛鼓励"你可以的";
      - 避免过度使用"过程反馈"来掩盖真实的困难程度——如果孩子确实遇到超出当前能力的任务,应如实调整任务难度而非只归因于努力。
    dose: 融入日常反馈习惯,建议先在1-2类重复出现的场景(如作业/日常小任务)中刻意练习2-4周
    age_range: 6-15
    observable_signal: 孩子在遇到困难时更多描述"具体哪里卡住了"而非只说"我不会/我很笨";愿意重新尝试的比例提高。
    contraindication: >
      若孩子的困难实际来自能力发展阶段限制、学习障碍或超出当前发展水平的任务要求,不适用"纯归因调整"框架,
      须先评估任务难度是否匹配,避免把发展性/能力性限制误判为"努力不够"造成孩子额外压力,必要时转介专业评估。
    failure_mode: >
      把"过程反馈"说成空洞的"你已经很努力了"而不具体;用"努力归因"掩盖孩子真实遇到的困难,
      导致孩子反复挫败却被告知"只是不够努力"，这正是TH-006里meta分析揭示的"信念调整不能替代真实的技能/资源支持"这一风险。
    risk_level: low
    human_requirement: none
    tags: [成长型思维, 归因反馈, 学业动机, method]
    open_questions:
      - 本方法卡是从TH-006理论机制推导的具体反馈话术操作化设计,鉴于TH-006本身的anti-overclaim证据(meta分析显示信念类干预对成绩效应很小),
        本方法不得被宣传为"能显著提升学业成绩"，只能定位为"有理论支持的反馈方式，效果需具体观察"。

  - id: MD-007
    name: 自主支持式规则协商法
    summary: 在设定学习/生活规则时,把孩子的选择权、解释与情感联结主动纳入,让规则执行同时支持自主性、胜任感与归属感三种基本心理需求,而不是单纯要求服从。
    grounded_in: [TH-007, TH-001, TH-002, TH-006]
    targets_constructs: [CN-008, CN-003]
    steps:
      - 设定规则前,先在可协商范围内给孩子选择("先写作业还是先运动,你选一个"),明确哪些是不可协商的底线、哪些可以协商;
      - 说明规则背后的理由(呼应MD-002),让孩子理解"为什么"而不仅是"要怎么做";
      - 给的任务/挑战与孩子当前能力匹配,反馈聚焦具体过程(呼应MD-006),避免"太难导致放弃"或"太易导致敷衍";
      - 无论规则执行结果如何,单独表达情感联结不与表现绑定("不管今天作业写得顺不顺,我们晚上还是可以一起看会儿书")。
    dose: 融入日常规则设定与执行场景,持续践行,建议2-4周后回顾孩子的配合度与情绪状态变化
    age_range: 4-15
    observable_signal: 孩子主动参与协商而非被动接受或对抗;规则执行时的情绪对抗强度下降;孩子在完成任务后主动分享过程而非只关心结果评价。
    contraindication: 涉及安全底线的规则不进入"选择协商"环节,须清晰不可谈判(呼应MD-002同类边界)。
    failure_mode: 把"给选择权"做成"孩子说什么都答应"的放纵;把"解释理由"做成冗长说教;情感表达变成有条件的("你要是听话我才...")。
    risk_level: low
    human_requirement: none
    tags: [自我决定理论, 自主支持, 教养方式, method]
    open_questions:
      - 本方法卡整合了TH-002/TH-006/TH-007/TH-001多条理论机制,是本平台的综合操作化设计,尚无独立RCT验证这套整合流程本身的效果;
        整合多个理论虽然逻辑自洽,但存在"看起来合理实际未验证"的风险,需在open_questions中持续标注直到有直接效果观察数据。

  - id: MD-008
    name: 对话式语言互动练习(词汇丰富化)
    summary: 照养者在日常互动中刻意增加词汇多样性、使用完整句而非简单指令,并把单向指令转为跟进孩子话题的对话式交流。
    grounded_in: [TH-008]
    targets_constructs: [CN-009]
    steps:
      - 日常给孩子指令/描述事物时,刻意使用更丰富的词汇替代重复的简单词("这个杯子是透明的/圆圆的",而不是反复说"这个""那个");
      - 孩子发起一个话题时,尽量跟进提问("你说的那只小狗后来怎么样了?"),而不是简单回应后转移话题或用"嗯嗯"敷衍;
      - 每天找1-2个时机,谈论不在眼前发生的事(昨天做了什么/明天要去哪),练习去情境化语言;
      - 不要求"教学式"地刻意纠正孩子的语法错误,重点是照养者自己的语言输入丰富度,而非直接矫正孩子的表达。
    dose: 融入日常互动,建议每天至少2-3次刻意的对话式跟进,持续观察
    age_range: 0-6
    observable_signal: 孩子主动发起话题的频次;孩子使用的词汇/句式复杂度随时间的变化(需长期观察,非短期可见)。
    contraindication: 若儿童存在语言发育明显迟缓的迹象(如同龄儿童常见词汇量远低于预期),不适用"自助式练习替代评估",须转介专业语言发育评估,不得用本方法延误专业干预时机。
    failure_mode: 把"词汇丰富化"做成刻意的词汇轰炸/教学式纠错,失去自然对话的互动感;只顾自己说,不跟进孩子发起的话题。
    risk_level: low
    human_requirement: none
    tags: [语言发展, 词汇习得, 照养者语言输入, method]
    open_questions:
      - 本方法卡是从TH-008理论机制推导的操作化设计,尚无独立干预研究验证这套具体练习流程本身对词汇发展的因果效应。

  - id: MD-009
    name: 社交情境"六步"复盘法
    summary: 孩子发生同伴冲突后,不直接下"你脾气不好"的结论,而是和孩子一起复盘信息加工的具体步骤,定位问题出在哪一步(看错了线索?想错了原因?还是想不出别的办法?)。
    grounded_in: [TH-009]
    targets_constructs: [CN-010]
    steps:
      - 冲突平息、孩子情绪稳定后(不在冲突当下,呼应MD-001先连接再纠正的时序),问"刚才发生了什么,你看到/听到了什么";
      - 追问"你觉得他是故意的还是不小心的",帮孩子把"发生的事实"和"自己对动机的猜测"分开,不预设孩子的猜测是对的也不预设是错的;
      - 问"除了刚才那样做,还能怎么做",如果孩子想不出别的办法,家长提供1-2个具体选项供孩子评价("这个办法你觉得怎么样"),不直接替孩子做决定;
      - 不在每次冲突后都做完整复盘,选择孩子情绪平稳、有精力参与讨论的时机,避免变成"每次犯错都要接受审讯"。
    dose: 每次明显的同伴冲突事件后择机进行,不需要每天固定练习
    age_range: 4-12
    observable_signal: 孩子在复盘时能区分"发生的事"和"自己的猜测";孩子能自己想出不止一种应对方式的比例提高。
    contraindication: >
      若冲突涉及明显的欺凌/被欺凌、人身伤害,不适用"复盘式讨论"框架处理当下的安全问题,
      须先处理安全与人身保护,复盘讨论只在事后情绪平稳、无持续风险时进行,严重情况须转介专业支持。
    failure_mode: 把复盘做成"审问式"追责;每次冲突都要求复盘导致孩子反感/抵触讨论社交话题。
    risk_level: low
    human_requirement: none
    tags: [同伴关系, 社会信息加工, 冲突复盘, method]
    open_questions:
      - 本方法卡是从TH-009理论机制推导的操作化设计,尚无独立干预研究验证这套具体复盘流程本身的效果;
        TH-009本身支持"诊断定位偏差在哪一步"，但"复盘练习能改善该步骤"这一干预假设未经本平台核验直接效果证据。
