name: Family 35UI Alignment

on:
  pull_request:
    paths:
      - "50_开发_dev/apps/mobile/**"
      - "50_开发_dev/apps/api/**"
      - "50_开发_dev/packages/contracts/**"
      - "50_开发_dev/pnpm-lock.yaml"
      - "50_开发_dev/pnpm-workspace.yaml"
      - "50_开发_dev/governance/FAMILY_35UI_RUNTIME_MATRIX_V1.json"
      - "50_开发_dev/architecture/FAMILY_35UI_FULLSTACK_ARCHITECTURE_V1.md"
      - "50_开发_dev/tools/validate-35ui-alignment.mjs"
      - ".github/workflows/family-35ui-alignment.yml"

jobs:
  alignment:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 50_开发_dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: 50_开发_dev/pnpm-lock.yaml
      - name: Install (fails fast with an explicit lockfile-staleness message, not a raw pnpm error)
        run: |
          set -o pipefail
          if ! pnpm install --frozen-lockfile 2>&1 | tee /tmp/pnpm-install.log; then
            if grep -q "ERR_PNPM_OUTDATED_LOCKFILE" /tmp/pnpm-install.log; then
              echo "##[error]pnpm-lock.yaml is out of date with one or more package.json files (see 'specifiers' diff above)."
              echo "##[error]Run 'pnpm install' locally to regenerate the lockfile and commit it alongside the dependency change."
            fi
            exit 1
          fi
      - run: pnpm validate:35ui
      - run: pnpm --filter @family/contracts typecheck
